services:
  db:
    image: postgres:16-alpine
    container_name: warehouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - warehouse-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warehouse-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_NAME: "warehouse_db"
      DB_SSLMODE: "disable"
      JWT_SECRET: "super-secret-jwt-key-warehouse-testbench-2026"
    networks:
      - warehouse-net

volumes:
  postgres_data:

networks:
  warehouse-net:
    driver: bridge
