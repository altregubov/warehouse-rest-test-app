            $ref: '#/definitions/domain.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "404":
