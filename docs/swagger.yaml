basePath: /
definitions:
  CreateOrderRequest:
    properties:
      product_id:
        example: c0000000-0000-0000-0000-000000000001
        format: uuid
        type: string
      quantity:
        example: 1
        minimum: 1
        type: integer
    required:
    - product_id
    - quantity
    type: object
  CreateProductRequest:
    properties:
      category:
        example: laptop
        type: string
      manufacturer:
        example: Apple
        type: string
      model:
        example: MacBook Air M3
        type: string
      price:
        example: 1099
        format: double
        minimum: 0
        type: number
      stock_quantity:
        example: 10
        minimum: 0
        type: integer
    required:
    - category
    - manufacturer
    - model
    - price
    - stock_quantity
    type: object
  CreateUserRequest:
    properties:
      allowed_categories:
        example:
        - laptop
        items:
          type: string
        type: array
      allowed_manufacturers:
        example:
        - Dell
        items:
          type: string
        type: array
      balance:
        example: 1000
        format: double
        minimum: 0
        type: number
      password:
        example: secret123
        type: string
      role:
        enum:
        - admin
        - user
        example: user
        type: string
      username:
        example: john_doe
        minLength: 1
        type: string
    required:
    - balance
    - password
    - role
    - username
    type: object
  ErrorDetails:
    properties:
      code:
        example: BAD_REQUEST
        type: string
      details:
        items:
          $ref: '#/definitions/FieldViolation'
        type: array
      message:
        example: Detailed error description
        type: string
    required:
    - code
    - message
    type: object
  ErrorEnvelope:
    properties:
      error:
        $ref: '#/definitions/ErrorDetails'
      requestId:
        example: c56a4180-65aa-42ec-a945-5fd21dec0538
        type: string
      success:
        example: false
        type: boolean
    required:
    - error
    - success
    type: object
  FieldViolation:
    properties:
      field:
        example: quantity
        type: string
      issue:
        example: quantity must be greater than 0
        type: string
    required:
    - field
    - issue
    type: object
  LoginRequest:
    properties:
      password:
        example: admin123
        type: string
      username:
        example: admin
        minLength: 1
        type: string
    required:
    - password
    - username
    type: object
  LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/UserSummary'
    required:
    - token
    - user
    type: object
  OrderResponse:
    properties:
      created_at:
        format: date-time
        type: string
      order_id:
        example: d0000000-0000-0000-0000-000000000001
        format: uuid
        type: string
      product_id:
        example: c0000000-0000-0000-0000-000000000001
        format: uuid
        type: string
      product_model:
        example: MacBook Pro 16 M3
        type: string
      quantity:
        example: 1
        minimum: 1
        type: integer
      remaining_balance:
        example: 500
        format: double
        minimum: 0
        type: number
      status:
        enum:
        - PROCESSED
        - CANCELLED
        - FAILED
        example: PROCESSED
        type: string
      total_price:
        example: 4998
        format: double
        minimum: 0
        type: number
      unit_price:
        example: 2499
        format: double
        minimum: 0
        type: number
      user_id:
        example: b0000000-0000-0000-0000-000000000002
        format: uuid
        type: string
    required:
    - created_at
    - order_id
    - product_id
    - product_model
    - quantity
    - status
    - total_price
    - unit_price
    type: object
  PaginationMetadata:
    properties:
      page:
        example: 1
        minimum: 1
        type: integer
      page_size:
        example: 20
        maximum: 100
        minimum: 1
        type: integer
      total_count:
        example: 45
        minimum: 0
        type: integer
      total_pages:
        example: 3
        minimum: 0
        type: integer
    required:
    - page
    - page_size
    - total_count
    - total_pages
    type: object
  Product:
    properties:
      category:
        example: laptop
        type: string
      created_at:
        format: date-time
        type: string
      id:
        example: c0000000-0000-0000-0000-000000000001
        format: uuid
        type: string
      manufacturer:
        example: Apple
        type: string
      model:
        example: MacBook Pro 16 M3
        type: string
      price:
        example: 2499
        format: double
        minimum: 0
        type: number
      stock_quantity:
        example: 15
        minimum: 0
        type: integer
      updated_at:
        format: date-time
        type: string
    required:
    - category
    - created_at
    - id
    - manufacturer
    - model
    - price
    - stock_quantity
    - updated_at
    type: object
  SuccessEnvelope:
    properties:
      data: {}
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      pagination:
        $ref: '#/definitions/PaginationMetadata'
      requestId:
        example: c56a4180-65aa-42ec-a945-5fd21dec0538
        type: string
      success:
        example: true
        type: boolean
      total_count:
        example: 45
        type: integer
      total_pages:
        example: 3
        type: integer
    required:
    - data
    - success
    type: object
  TopUpBalanceRequest:
    properties:
      increment_amount:
        example: 500
        format: double
        minimum: 0.01
        type: number
    required:
    - increment_amount
    type: object
  UpdateFiltersRequest:
    properties:
      allowed_categories:
        example:
        - laptop
        items:
          type: string
        type: array
      allowed_manufacturers:
        example:
        - Apple
        - Dell
        items:
          type: string
        type: array
    required:
    - allowed_categories
    - allowed_manufacturers
    type: object
  UpdateOrderStatusRequest:
    properties:
      status:
        enum:
        - PROCESSED
        - CANCELLED
        - FAILED
        example: CANCELLED
        type: string
    required:
    - status
    type: object
  UpdateStockRequest:
    properties:
      stock_quantity:
        example: 25
        maximum: 2147483647
        minimum: 0
        type: integer
    required:
    - stock_quantity
    type: object
  UserSummary:
    properties:
      allowed_categories:
        example:
        - laptop
        items:
          type: string
        type: array
      allowed_manufacturers:
        example:
        - Dell
        items:
          type: string
        type: array
      balance:
        example: 1000
        format: double
        minimum: 0
        type: number
      id:
        example: b0000000-0000-0000-0000-000000000002
        format: uuid
        type: string
      role:
        enum:
        - admin
        - user
        example: user
        type: string
      username:
        example: userA
        minLength: 1
        type: string
    required:
    - allowed_categories
    - allowed_manufacturers
    - balance
    - id
    - role
    - username
    type: object
host: localhost:8080
info:
  contact: {}
  description: Clean, lightweight, and idiomatic Go backend for warehouse inventory
    and transactional ordering.
  title: Warehouse REST API Testbench
  version: "1.0"
paths:
  /api/admin/login:
    post:
      consumes:
      - application/json
      description: Authenticate an admin user and return a JWT token with admin claims
      operationId: adminLogin
      parameters:
      - description: Admin credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            allOf:
            - $ref: '#/definitions/SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/LoginResponse'
              type: object
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "401":
          description: Invalid username or password
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/ErrorEnvelope'
      summary: Admin authentication
      tags:
      - Auth
  /api/admin/orders:
    get:
      description: Retrieve all orders across the system for administrative auditing
        and fulfillment
      operationId: listAdminOrders
      produces:
      - application/json
      responses:
        "200":
          description: List of all orders
          schema:
            allOf:
            - $ref: '#/definitions/SuccessEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/OrderResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List all orders (Admin)
      tags:
      - Admin
  /api/admin/orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: 'Update the lifecycle status of an order (Valid: PROCESSED, CANCELLED,
        FAILED). Setting CANCELLED or FAILED automatically refunds the customer balance and
        restores product stock.'
      operationId: updateOrderStatus
      parameters:
      - description: Order ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Order status payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateOrderStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Order status updated
          schema:
            allOf:
            - $ref: '#/definitions/SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/OrderResponse'
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "422":
          description: Invalid status transition
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update order status
      tags:
      - Admin
  /api/admin/products:
    get:
      description: Retrieve full unrestricted product inventory for administrators
      operationId: listAdminProducts
      produces:
      - application/json
      responses:
        "200":
          description: List of all products
          schema:
            allOf:
            - $ref: '#/definitions/SuccessEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/Product'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List all warehouse products (Admin)
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Add a new product item with arbitrary category, manufacturer, model,
        price, and stock
      operationId: createProduct
      parameters:
      - description: Product details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Product created
          schema:
            allOf:
            - $ref: '#/definitions/SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/Product'
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Add a new product to warehouse
      tags:
      - Admin
  /api/admin/products/{id}/stock:
    patch:
      consumes:
      - application/json
      description: Set stock quantity for a warehouse product
      operationId: updateProductStock
      parameters:
      - description: Product ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Stock update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateStockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Stock updated
          schema:
            allOf:
            - $ref: '#/definitions/SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/Product'
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update product stock quantity
      tags:
      - Admin
  /api/admin/users:
    get:
      description: Query paginated list of users with optional role filtering
      operationId: listAdminUsers
      parameters:
      - description: Filter by role (admin or user)
        in: query
        name: role
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of users
          schema:
            allOf:
            - $ref: '#/definitions/SuccessEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/UserSummary'
                  type: array
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Create a new admin or regular user account
      operationId: createAdminUser
      parameters:
      - description: User details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created
          schema:
            allOf:
            - $ref: '#/definitions/SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/UserSummary'
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "409":
          description: Username already exists
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Create a user account
      tags:
      - Admin
  /api/admin/users/{id}:
    delete:
      description: Marks user as deactivated/deleted while preserving immutable historical
        order records
      operationId: deleteAdminUser
      parameters:
      - description: User ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User deactivated successfully
          schema:
            allOf:
            - $ref: '#/definitions/SuccessEnvelope'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Soft-delete a user account
      tags:
      - Admin
    get:
      description: Retrieve a specific user account by UUID
      operationId: getAdminUserById
      parameters:
      - description: User ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User details
          schema:
            allOf:
            - $ref: '#/definitions/SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/UserSummary'
              type: object
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - Admin
  /api/admin/users/{id}/balance/top-up:
    post:
      consumes:
      - application/json
      description: Increases the user account balance by a specified increment amount
        (minimum 0.01)
      operationId: topUpUserBalance
      parameters:
      - description: User ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Balance top-up payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/TopUpBalanceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Balance topped up
          schema:
            allOf:
            - $ref: '#/definitions/SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/UserSummary'
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "422":
          description: Unprocessable entity / validation failure
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Top up user balance by an increment
      tags:
      - Admin
  /api/admin/users/{id}/filters:
    put:
      consumes:
      - application/json
      description: Set allowed categories and manufacturers for a user. Empty array
        removes restrictions.
      operationId: updateUserFilters
      parameters:
      - description: User ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: User filter permissions
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateFiltersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Filters updated
          schema:
            allOf:
            - $ref: '#/definitions/SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/UserSummary'
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Configure catalog access filters for a user
      tags:
      - Admin
  /api/user/login:
    post:
      consumes:
      - application/json
      description: Authenticate a regular user and return a JWT token with user claims
      operationId: userLogin
      parameters:
      - description: User credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            allOf:
            - $ref: '#/definitions/SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/LoginResponse'
              type: object
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "401":
          description: Invalid username or password
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "503":
          description: Service unavailable
          schema:
            $ref: '#/definitions/ErrorEnvelope'
      summary: User authentication
      tags:
      - Auth
  /api/user/orders:
    get:
      description: Returns all orders placed by the authenticated user
      operationId: listUserOrders
      produces:
      - application/json
      responses:
        "200":
          description: List of orders
          schema:
            allOf:
            - $ref: '#/definitions/SuccessEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/OrderResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorEnvelope'
        "500":
