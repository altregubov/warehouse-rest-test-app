basePath: /
definitions:
  github_com_altregubov_warehouse-rest-test-app_internal_domain.CreateOrderRequest:
    properties:
      product_id:
        example: c0000000-0000-0000-0000-000000000001
        type: string
      quantity:
        example: 1
        type: integer
    type: object
  github_com_altregubov_warehouse-rest-test-app_internal_domain.CreateProductRequest:
    properties:
      category:
        example: laptop
        type: string
      manufacturer:
        example: Apple
        type: string
      model:
        example: MacBook Air M3
        type: string
      price:
        example: 1099
        type: number
      stock_quantity:
        example: 10
        type: integer
    type: object
  github_com_altregubov_warehouse-rest-test-app_internal_domain.CreateUserRequest:
    properties:
      allowed_categories:
        example:
        - '["laptop"]'
        items:
          type: string
        type: array
      allowed_manufacturers:
        example:
        - '["Dell"]'
        items:
          type: string
        type: array
      balance:
        example: 1000
        type: number
      password:
        example: secret123
        type: string
      role:
        example: user
        type: string
      username:
        example: john_doe
        type: string
    type: object
  github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorDetails:
    properties:
      code:
        example: BAD_REQUEST
        type: string
      details: {}
      message:
        example: Detailed error description
        type: string
    type: object
  github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope:
    properties:
      error:
        $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorDetails'
      success:
        example: false
        type: boolean
    type: object
  github_com_altregubov_warehouse-rest-test-app_internal_domain.LoginRequest:
    properties:
      password:
        example: admin123
        type: string
      username:
        example: admin
        type: string
    type: object
  github_com_altregubov_warehouse-rest-test-app_internal_domain.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.UserSummary'
    type: object
  github_com_altregubov_warehouse-rest-test-app_internal_domain.OrderResponse:
    properties:
      created_at:
        type: string
      order_id:
        type: string
      product_id:
        type: string
      product_model:
        type: string
      quantity:
        type: integer
      remaining_balance:
        type: number
      total_price:
        type: number
      unit_price:
        type: number
    type: object
  github_com_altregubov_warehouse-rest-test-app_internal_domain.Product:
    properties:
      category:
        type: string
      created_at:
        type: string
      id:
        type: string
      manufacturer:
        type: string
      model:
        type: string
      price:
        type: number
      stock_quantity:
        type: integer
      updated_at:
        type: string
    type: object
  github_com_altregubov_warehouse-rest-test-app_internal_domain.SuccessEnvelope:
    properties:
      data: {}
      success:
        example: true
        type: boolean
    type: object
  github_com_altregubov_warehouse-rest-test-app_internal_domain.UpdateBalanceRequest:
    properties:
      amount:
        example: 500
        type: number
    type: object
  github_com_altregubov_warehouse-rest-test-app_internal_domain.UpdateFiltersRequest:
    properties:
      allowed_categories:
        example:
        - '["laptop"]'
        items:
          type: string
        type: array
      allowed_manufacturers:
        example:
        - '["Apple"'
        - ' "Dell"]'
        items:
          type: string
        type: array
    type: object
  github_com_altregubov_warehouse-rest-test-app_internal_domain.UpdateStockRequest:
    properties:
      stock_quantity:
        example: 25
        type: integer
    type: object
  github_com_altregubov_warehouse-rest-test-app_internal_domain.UserSummary:
    properties:
      allowed_categories:
        items:
          type: string
        type: array
      allowed_manufacturers:
        items:
          type: string
        type: array
      balance:
        type: number
      id:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Clean, lightweight, and idiomatic Go backend for warehouse inventory
    and transactional ordering.
  title: Warehouse REST API Testbench
  version: "1.0"
paths:
  /api/admin/login:
    post:
      consumes:
      - application/json
      description: Authenticate an admin user and return a JWT token with admin claims
      parameters:
      - description: Admin credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            allOf:
            - $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.LoginResponse'
              type: object
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "403":
          description: 'Forbidden: user is not an admin'
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
      summary: Admin authentication
      tags:
      - Auth
  /api/admin/products:
    post:
      consumes:
      - application/json
      description: Add a new product item with arbitrary category, manufacturer, model,
        price, and stock
      parameters:
      - description: Product details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Product created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.Product'
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Add a new product to warehouse
      tags:
      - Admin
  /api/admin/products/{id}/stock:
    patch:
      consumes:
      - application/json
      description: Set stock quantity for a warehouse product
      parameters:
      - description: Product ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Stock update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.UpdateStockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Stock updated
          schema:
            allOf:
            - $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.Product'
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update product stock quantity
      tags:
      - Admin
  /api/admin/users:
    post:
      consumes:
      - application/json
      description: Create a new admin or regular user account
      parameters:
      - description: User details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.UserSummary'
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "409":
          description: Username already exists
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Create a user account
      tags:
      - Admin
  /api/admin/users/{id}/balance:
    patch:
      consumes:
      - application/json
      description: Adjust user account balance by a specified amount (e.g. +500.00)
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Balance adjustment payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.UpdateBalanceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Balance updated
          schema:
            allOf:
            - $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.UserSummary'
              type: object
        "400":
          description: Invalid input or negative balance
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update or top up user balance
      tags:
      - Admin
  /api/admin/users/{id}/filters:
    put:
      consumes:
      - application/json
      description: Set allowed categories and manufacturers for a user. Empty array
        removes restrictions.
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: User filter permissions
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.UpdateFiltersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Filters updated
          schema:
            allOf:
            - $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.UserSummary'
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Configure catalog access filters for a user
      tags:
      - Admin
  /api/user/login:
    post:
      consumes:
      - application/json
      description: Authenticate a regular user and return a JWT token with user claims
      parameters:
      - description: User credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            allOf:
            - $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.LoginResponse'
              type: object
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "403":
          description: 'Forbidden: user is an admin attempting regular login'
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
      summary: User authentication
      tags:
      - Auth
  /api/user/orders:
    post:
      consumes:
      - application/json
      description: Atomically purchases a product item, decrements stock, and deducts
        user balance
      parameters:
      - description: Purchase order request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Order placed successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.OrderResponse'
              type: object
        "400":
          description: Invalid input, insufficient stock or balance
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "403":
          description: Product disallowed by user filters
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "404":
          description: Product or user not found
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Purchase product from warehouse
      tags:
      - User
  /api/user/products:
    get:
      consumes:
      - application/json
      description: Browse warehouse items with optional category query filter and
        strict permission filtering
      parameters:
      - description: Filter by category (e.g. laptop, smartphone)
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of allowed products
          schema:
            allOf:
            - $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.SuccessEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.Product'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Browse warehouse catalog
      tags:
      - User
  /api/user/profile:
    get:
      consumes:
      - application/json
      description: Returns the profile, current balance, and assigned filter permissions
        for the logged in user
      produces:
      - application/json
      responses:
        "200":
          description: User profile
          schema:
            allOf:
            - $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.UserSummary'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_altregubov_warehouse-rest-test-app_internal_domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get authenticated user profile
      tags:
      - User
securityDefinitions:
  BearerAuth:
    description: 'Type "Bearer" followed by a space and JWT token. Example: "Bearer
      ey..."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
