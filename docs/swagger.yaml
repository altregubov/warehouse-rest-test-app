      tags:
      - User
    post:
      consumes:
      - application/json
      description: Atomically purchases a product item, decrements stock, and deducts
        user balance
      parameters:
      - description: Unique idempotency key to prevent double processing
        in: header
        name: Idempotency-Key
        type: string
      - description: Purchase order request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Order placed successfully
          schema:
            allOf:
            - $ref: '#/definitions/domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.OrderResponse'
              type: object
        "400":
          description: Malformed JSON syntax or schema validation failure
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "404":
          description: Product or user not found
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "409":
          description: Idempotency conflict or concurrent request in flight
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "422":
          description: Domain business rule violation (INSUFFICIENT_FUNDS, INSUFFICIENT_STOCK,
