basePath: /
definitions:
  domain.CreateOrderRequest:
    properties:
      product_id:
        example: c0000000-0000-0000-0000-000000000001
        format: uuid
        type: string
      quantity:
        example: 1
        minimum: 1
        type: integer
    required:
    - product_id
    - quantity
    type: object
  domain.CreateProductRequest:
    properties:
      category:
        example: laptop
        type: string
      manufacturer:
        example: Apple
        type: string
      model:
        example: MacBook Air M3
        type: string
      price:
        example: 1099
        format: double
        minimum: 0
        type: number
      stock_quantity:
        example: 10
        minimum: 0
        type: integer
    required:
    - category
    - manufacturer
    - model
    - price
    - stock_quantity
    type: object
  domain.CreateUserRequest:
    properties:
      access_level:
        enum:
        - ALL
        - FILTERED
        - NONE
        example: FILTERED
        type: string
      allowed_categories:
        example:
        - '["laptop"]'
        items:
          type: string
        type: array
      allowed_manufacturers:
        example:
        - '["Dell"]'
        items:
          type: string
        type: array
      balance:
        example: 1000
        format: double
        minimum: 0
        type: number
      catalog_access_enabled:
        example: true
        type: boolean
      password:
        example: secret123
        minLength: 4
        type: string
      role:
        enum:
        - admin
        - user
        example: user
        type: string
      username:
        example: john_doe
        minLength: 1
        type: string
    required:
    - balance
    - password
    - role
    - username
    type: object
  domain.ErrorDetails:
    properties:
      code:
        example: BAD_REQUEST
        type: string
      details: {}
      message:
        example: Detailed error description
        type: string
    required:
    - code
    - message
    type: object
  domain.ErrorEnvelope:
    properties:
      error:
        $ref: '#/definitions/domain.ErrorDetails'
      success:
        example: false
        type: boolean
    required:
    - error
    - success
    type: object
  domain.LoginRequest:
    properties:
      password:
        example: admin123
        minLength: 4
        type: string
      username:
        example: admin
        minLength: 1
        type: string
    required:
    - password
    - username
    type: object
  domain.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/domain.UserSummary'
    required:
    - token
    - user
    type: object
  domain.OrderResponse:
    properties:
      created_at:
        format: date-time
        type: string
      order_id:
        example: d0000000-0000-0000-0000-000000000001
        format: uuid
        type: string
      product_id:
        example: c0000000-0000-0000-0000-000000000001
        format: uuid
        type: string
      product_model:
        example: MacBook Pro 16 M3
        type: string
      quantity:
        example: 1
        minimum: 1
        type: integer
      remaining_balance:
        example: 500
        format: double
        minimum: 0
        type: number
      status:
        enum:
        - CREATED
        - PROCESSING
        - SHIPPED
        - DELIVERED
        - CANCELLED
        example: CREATED
        type: string
      total_price:
        example: 4998
        format: double
        minimum: 0
        type: number
      unit_price:
        example: 2499
        format: double
        minimum: 0
        type: number
      user_id:
        example: b0000000-0000-0000-0000-000000000002
        format: uuid
        type: string
    required:
    - created_at
    - order_id
    - product_id
    - product_model
    - quantity
    - status
    - total_price
    - unit_price
    type: object
  domain.Product:
    properties:
      category:
        example: laptop
        type: string
      created_at:
        format: date-time
        type: string
      id:
        example: c0000000-0000-0000-0000-000000000001
        format: uuid
        type: string
      manufacturer:
        example: Apple
        type: string
      model:
        example: MacBook Pro 16 M3
        type: string
      price:
        example: 2499
        format: double
        minimum: 0
        type: number
      stock_quantity:
        example: 15
        minimum: 0
        type: integer
      updated_at:
        format: date-time
        type: string
    required:
    - category
    - created_at
    - id
    - manufacturer
    - model
    - price
    - stock_quantity
    - updated_at
    type: object
  domain.SetBalanceRequest:
    properties:
      new_balance:
        example: 5000
        format: double
        minimum: 0
        type: number
    required:
    - new_balance
    type: object
  domain.SuccessEnvelope:
    properties:
      data: {}
      success:
        example: true
        type: boolean
    required:
    - data
    - success
    type: object
  domain.TopUpBalanceRequest:
    properties:
      increment_amount:
        example: 500
        format: double
        minimum: 0.01
        type: number
    required:
    - increment_amount
    type: object
  domain.UpdateBalanceRequest:
    properties:
      amount:
        example: 500
        format: double
        type: number
    required:
    - amount
    type: object
  domain.UpdateFiltersRequest:
    properties:
      access_level:
        enum:
        - ALL
        - FILTERED
        - NONE
        example: FILTERED
        type: string
      allowed_categories:
        example:
        - '["laptop"]'
        items:
          type: string
        type: array
      allowed_manufacturers:
        example:
        - '["Apple"'
        - ' "Dell"]'
        items:
          type: string
        type: array
      catalog_access_enabled:
        example: true
        type: boolean
    required:
    - allowed_categories
    - allowed_manufacturers
    type: object
  domain.UpdateOrderStatusRequest:
    properties:
      status:
        enum:
        - CREATED
        - PROCESSING
        - SHIPPED
        - DELIVERED
        - CANCELLED
        example: SHIPPED
        type: string
    required:
    - status
    type: object
  domain.UpdateStockRequest:
    properties:
      stock_quantity:
        example: 25
        minimum: 0
        type: integer
    required:
    - stock_quantity
    type: object
  domain.UserSummary:
    properties:
      access_level:
        enum:
        - ALL
        - FILTERED
        - NONE
        example: FILTERED
        type: string
      allowed_categories:
        example:
        - '["laptop"]'
        items:
          type: string
        type: array
      allowed_manufacturers:
        example:
        - '["Dell"]'
        items:
          type: string
        type: array
      balance:
        example: 1000
        format: double
        minimum: 0
        type: number
      catalog_access_enabled:
        example: true
        type: boolean
      id:
        example: b0000000-0000-0000-0000-000000000002
        format: uuid
        type: string
      role:
        enum:
        - admin
        - user
        example: user
        type: string
      username:
        example: userA
        minLength: 1
        type: string
    required:
    - access_level
    - allowed_categories
    - allowed_manufacturers
    - balance
    - id
    - role
    - username
    type: object
host: localhost:8080
info:
  contact: {}
  description: Clean, lightweight, and idiomatic Go backend for warehouse inventory
    and transactional ordering.
  title: Warehouse REST API Testbench
  version: "1.0"
paths:
  /api/admin/login:
    post:
      consumes:
      - application/json
      description: Authenticate an admin user and return a JWT token with admin claims
      parameters:
      - description: Admin credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            allOf:
            - $ref: '#/definitions/domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.LoginResponse'
              type: object
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "401":
          description: Invalid username or password
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
      summary: Admin authentication
      tags:
      - Auth
  /api/admin/orders:
    get:
      consumes:
      - application/json
      description: Retrieve all orders across the system for administrative auditing
        and fulfillment
      produces:
      - application/json
      responses:
        "200":
          description: List of all orders
          schema:
            allOf:
            - $ref: '#/definitions/domain.SuccessEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.OrderResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List all orders (Admin)
      tags:
      - Admin
  /api/admin/orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: Update the fulfillment status of an order (e.g. PROCESSING, SHIPPED,
        DELIVERED, CANCELLED)
      parameters:
      - description: Order ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Order status payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateOrderStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Order status updated
          schema:
            allOf:
            - $ref: '#/definitions/domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.OrderResponse'
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "422":
          description: Invalid status transition
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update order fulfillment status
      tags:
      - Admin
  /api/admin/products:
    get:
      consumes:
      - application/json
      description: Retrieve full unrestricted product inventory for administrators
      produces:
      - application/json
      responses:
        "200":
          description: List of all products
          schema:
            allOf:
            - $ref: '#/definitions/domain.SuccessEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.Product'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List all warehouse products (Admin)
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Add a new product item with arbitrary category, manufacturer, model,
        price, and stock
      parameters:
      - description: Product details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Product created
          schema:
            allOf:
            - $ref: '#/definitions/domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.Product'
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Add a new product to warehouse
      tags:
      - Admin
  /api/admin/products/{id}/stock:
    patch:
      consumes:
      - application/json
      description: Set stock quantity for a warehouse product
      parameters:
      - description: Product ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Stock update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateStockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Stock updated
          schema:
            allOf:
            - $ref: '#/definitions/domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.Product'
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update product stock quantity
      tags:
      - Admin
  /api/admin/users:
    get:
      consumes:
      - application/json
      description: Query paginated list of users with optional role filtering
      parameters:
      - description: Filter by role (admin or user)
        in: query
        name: role
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of users
          schema:
            allOf:
            - $ref: '#/definitions/domain.SuccessEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.UserSummary'
                  type: array
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Create a new admin or regular user account
      parameters:
      - description: User details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created
          schema:
            allOf:
            - $ref: '#/definitions/domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.UserSummary'
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "409":
          description: Username already exists
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Create a user account
      tags:
      - Admin
  /api/admin/users/{id}:
    delete:
      consumes:
      - application/json
      description: Marks user as deactivated/deleted while preserving immutable historical
        order records
      parameters:
      - description: User ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User deactivated successfully
          schema:
            allOf:
            - $ref: '#/definitions/domain.SuccessEnvelope'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Soft-delete a user account
      tags:
      - Admin
    get:
      consumes:
      - application/json
      description: Retrieve a specific user account by UUID
      parameters:
      - description: User ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User details
          schema:
            allOf:
            - $ref: '#/definitions/domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.UserSummary'
              type: object
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - Admin
  /api/admin/users/{id}/balance:
    patch:
      consumes:
      - application/json
      description: Adjust user account balance by a specified amount (e.g. +500.00)
      parameters:
      - description: Unique idempotency key to prevent double processing
        in: header
        name: Idempotency-Key
        type: string
      - description: User ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Balance adjustment payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateBalanceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Balance updated
          schema:
            allOf:
            - $ref: '#/definitions/domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.UserSummary'
              type: object
        "400":
          description: Invalid input or negative balance
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "409":
          description: Idempotency conflict or concurrent request in flight
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "422":
          description: Unprocessable entity / validation failure
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update or top up user balance (Legacy)
      tags:
      - Admin
    put:
      consumes:
      - application/json
      description: Replaces the user account balance with a specified new balance
        (minimum 0.00)
      parameters:
      - description: Unique idempotency key to prevent double processing
        in: header
        name: Idempotency-Key
        type: string
      - description: User ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Absolute balance payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.SetBalanceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Balance set
          schema:
            allOf:
            - $ref: '#/definitions/domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.UserSummary'
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "409":
          description: Idempotency conflict or concurrent request in flight
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "422":
          description: Unprocessable entity / validation failure
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Set absolute user balance
      tags:
      - Admin
  /api/admin/users/{id}/balance/top-up:
    post:
      consumes:
      - application/json
      description: Increases the user account balance by a specified increment amount
        (minimum 0.01)
      parameters:
      - description: Unique idempotency key to prevent double processing
        in: header
        name: Idempotency-Key
        type: string
      - description: User ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Balance top-up payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.TopUpBalanceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Balance topped up
          schema:
            allOf:
            - $ref: '#/definitions/domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.UserSummary'
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "409":
          description: Idempotency conflict or concurrent request in flight
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "422":
          description: Unprocessable entity / validation failure
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domain.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Top up user balance by an increment
      tags:
      - Admin
  /api/admin/users/{id}/filters:
    put:
      consumes:
      - application/json
      description: Set allowed categories and manufacturers for a user. Empty array
        removes restrictions.
      parameters:
      - description: User ID (UUID)
        format: uuid
        in: path
        name: id
