      responses:
        "200":
          description: Filters updated
          schema:
            allOf:
            - $ref: '#/definitions/domain.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.UserSummary'
              type: object
        "400":
          description: Invalid input
